<style>
:root{
  --bg:#10171e;--bg2:#151f28;--panel:#192630;--panel2:#1e2d38;--line:#31414c;
  --text:#e7e8df;--muted:#a6b0ad;--soft:#73827f;--gold:#c8ad72;
  --green:#7eaa78;--yellow:#d2b267;--red:#c87570;--blue:#8eaab9;
  --shadow:0 12px 35px rgba(0,0,0,.18);--radius:12px;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#243643 0%,var(--bg) 58%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#app{max-width:1640px;margin:0 auto;padding:18px 22px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:4px 2px 16px;border-bottom:1px solid rgba(166,176,173,.18);margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand-name{font-family:Georgia,serif;letter-spacing:.18em;font-size:clamp(24px,3vw,34px);font-weight:500;color:#e5dfca}
.brand-sub{color:var(--muted);font-family:Georgia,serif;font-style:italic;font-size:14px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#22323d;color:var(--text);padding:9px 13px;border-radius:8px;font-weight:600;font-size:13px;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:#2a3d49;border-color:#52636b}.btn:active{transform:translateY(1px)}
.btn.primary{background:#526f58;border-color:#78927a;color:#f4f3e9}.btn.primary:hover{background:#638268}
.btn.gold{background:#796745;border-color:#b49b69;color:#fff8e8}.btn.gold:hover{background:#8a7650}
.btn.danger{background:#5b3538;border-color:#9a5b5c}.btn.ghost{background:transparent}.btn.block{width:100%;display:block}.btn.large{padding:12px 16px;font-size:14px}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.icon-btn{width:37px;height:37px;display:inline-grid;place-items:center;padding:0;font-size:16px}
.screen{animation:appear .22s ease-out}@keyframes appear{from{opacity:.55;transform:translateY(3px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(155deg,rgba(31,46,57,.97),rgba(23,35,44,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.welcome{max-width:850px;margin:7vh auto 0;padding:clamp(25px,5vw,54px);text-align:center}
.kicker{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1,h2,h3,h4,p{margin-top:0}h1,h2,h3{font-family:Georgia,serif;font-weight:500;line-height:1.2}h1{font-size:clamp(32px,5vw,48px);letter-spacing:.08em;color:#eee8d7;margin:10px 0 8px}h2{font-size:clamp(23px,3vw,30px);margin-bottom:10px}h3{font-size:20px;margin-bottom:8px}h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.lead{color:#c0c9c4;font-family:Georgia,serif;font-size:17px;line-height:1.75;max-width:650px;margin:0 auto 24px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0}
.actions-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.quiet{color:var(--soft)}.serif{font-family:Georgia,serif}.gold-text{color:var(--gold)}
.form-panel{max-width:700px;margin:24px auto;padding:clamp(20px,4vw,34px)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:#c4cec8;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.field input,.field select{background:#101a22;color:var(--text);border:1px solid #3c4d58;border-radius:8px;padding:11px 12px;min-width:0}.field input::placeholder{color:#75817f}.form-note{margin-top:16px;padding:12px 14px;background:rgba(200,173,114,.08);border-left:2px solid var(--gold);color:#c8c3ae;font-size:12px}
.game-grid{display:grid;grid-template-columns:245px minmax(360px,1fr) 270px;gap:14px;align-items:start}
.side{min-width:0;background:rgba(24,37,46,.91);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.side-heading{padding:13px 15px;color:#e4dfcd;font:500 17px Georgia,serif;border-bottom:1px solid rgba(166,176,173,.13)}
.side summary{list-style:none;padding:13px 15px;color:#e4dfcd;font:500 17px Georgia,serif;cursor:pointer}.side summary::-webkit-details-marker{display:none}.side summary:after{content:'＋';float:right;color:var(--muted);font:14px system-ui}.side[open] summary:after{content:'−'}
.side-content{padding:0 14px 14px}.side-section{padding:12px 0;border-top:1px solid rgba(166,176,173,.13)}.side-section:first-child{border-top:0;padding-top:3px}
.section-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:0 0 10px}
.identity-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}.identity-line span:first-child{color:var(--muted)}.identity-line strong{font-weight:650;text-align:right}
.resource{margin:10px 0}.resource-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:5px}.resource-head span:first-child{color:#c6d0ca}.resource-head strong{font-variant-numeric:tabular-nums;font-weight:700}.bar{height:6px;background:#0e171e;border-radius:99px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}.bar>i{height:100%;display:block;border-radius:99px;background:var(--green);transition:width .25s}.bar>i.good{background:var(--green)}.bar>i.warn{background:var(--yellow)}.bar>i.bad{background:var(--red)}
.system-row{display:grid;grid-template-columns:minmax(0,1fr) 76px 28px;align-items:center;gap:7px;margin:8px 0;font-size:10px;color:#bdc7c2}.system-row .bar{height:5px}.system-row strong{text-align:right;font-size:10px;font-variant-numeric:tabular-nums;color:#dce1d8}
.teams{display:flex;gap:7px}.team-dot{width:20px;height:20px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:10px}.team-dot.used{border-color:#53616a;color:#5d6b71;background:#17232b}
.center{min-width:0;padding:clamp(18px,2.5vw,30px);min-height:560px}.center-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.phase-tag{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-weight:800}.turn-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 9px}.story{font-family:Georgia,serif;font-size:16px;line-height:1.8;color:#d3d8cf;max-width:780px}.story p{margin:0 0 13px}.story em{color:#ece3c9}.event-quote{border-left:2px solid var(--gold);padding:5px 0 5px 17px;margin:17px 0;color:#d8d4c6;font:italic 17px/1.75 Georgia,serif}
.choice-list{display:grid;gap:10px;margin-top:23px}.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:13px 15px;background:#1b2a34;border:1px solid #3a4a54;border-radius:9px;color:var(--text)}.choice:hover{background:#253742;border-color:#6e817f}.choice strong{font-size:13px}.choice span{font-size:12px;line-height:1.5;color:#aebbb5}.choice:disabled{opacity:.45;cursor:not-allowed}
.site-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.stat-card{padding:10px 12px;border:1px solid rgba(166,176,173,.17);border-radius:8px;background:rgba(10,19,25,.23)}.stat-card .stat-name{font-size:11px;color:var(--muted);margin-bottom:4px}.stat-card .stat-value{font:17px Georgia,serif}.status{display:inline-block;border-radius:4px;padding:3px 7px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.status.green{background:rgba(126,170,120,.14);color:#a6c99e;border:1px solid rgba(126,170,120,.32)}.status.yellow{background:rgba(210,178,103,.13);color:#e0c582;border:1px solid rgba(210,178,103,.32)}.status.red{background:rgba(200,117,112,.13);color:#e39a94;border:1px solid rgba(200,117,112,.32)}.status.neutral{background:rgba(142,170,185,.12);color:#aec4d0;border:1px solid rgba(142,170,185,.28)}
.site-note{background:rgba(142,170,185,.07);border:1px solid rgba(142,170,185,.2);border-radius:8px;padding:12px 14px;font-size:12px;color:#b9c8ca;margin:15px 0}.discovery{border-left:2px solid var(--green);padding:9px 12px;background:rgba(126,170,120,.07);margin:9px 0;border-radius:0 7px 7px 0}.discovery strong{font:16px Georgia,serif;color:#c8d8c0}.discovery p{font-size:12px;color:#b4c1b8;margin:5px 0 0;line-height:1.6}
.diary-entry{padding:10px 0;border-top:1px solid rgba(166,176,173,.13)}.diary-entry:first-child{border-top:0;padding-top:2px}.diary-meta{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}.diary-title{font:15px Georgia,serif;color:#e1e1d4;margin-bottom:3px}.diary-text{font-size:11px;line-height:1.55;color:#aebbb5}
.empty-note{color:var(--muted);font:italic 14px Georgia,serif;padding:15px 0}.journal-full{max-height:430px;overflow:auto;padding-right:5px}
.ending-score{font:42px Georgia,serif;color:#d8c18a}.ending-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.ending-stat{background:rgba(8,16,21,.26);padding:13px;border:1px solid var(--line);border-radius:8px}.ending-stat strong{display:block;font:20px Georgia,serif;color:#e7dfc9}.ending-stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.memory-list{display:grid;gap:10px;margin-top:20px}.memory-card{padding:15px 17px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.memory-card h3{font-size:18px;margin:0 0 5px}.memory-card p{font-size:12px;color:var(--muted);margin:0}.memory-tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.memory-detail{max-width:900px;margin:20px auto;padding:clamp(20px,4vw,34px)}
.footer-note{font-size:11px;color:var(--soft);text-align:center;margin:20px auto 0;max-width:900px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#d9ddcf;color:#172129;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:650;box-shadow:var(--shadow);z-index:10;animation:appear .2s ease-out}
@media(min-width:921px){.side summary{display:none}.side-content{display:block!important}.left-side{position:sticky;top:12px}}
@media(max-width:1100px){#app{padding:14px}.game-grid{grid-template-columns:220px minmax(330px,1fr) 235px;gap:10px}.center{padding:18px}.side-content{padding-left:11px;padding-right:11px}}
@media(max-width:920px){.game-grid{grid-template-columns:1fr}.left-side{grid-row:1}.center{grid-row:2;min-height:0}.right-side{grid-row:3}.side{border-radius:9px}.side summary{font-size:16px}.side-content{padding:0 15px 14px}.resource-list{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.systems-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:15px}.center{padding:20px}.brand-sub{display:none}}
@media(max-width:620px){#app{padding:10px}.topbar{align-items:flex-start}.brand{display:block}.brand-name{font-size:24px}.top-actions{gap:5px}.top-actions .btn{padding:7px 9px;font-size:11px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.welcome{margin-top:4vh;padding:25px 18px}.site-stats{grid-template-columns:1fr 1fr}.ending-grid{grid-template-columns:1fr}.memory-card{grid-template-columns:1fr}.memory-card .btn{justify-self:start}.center{padding:17px 14px}.story{font-size:15px}.choice-list{margin-top:16px}}
</style>
</head>

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,Number(n)||0));}
function rand(g,channel){let t=(g.rng[channel]+=(0x6D2B79F5))>>>0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;}
function irand(g,ch,min,max){return min+Math.floor(rand(g,ch)*(max-min+1));}
function pick(g,ch,a){return a[Math.floor(rand(g,ch)*a.length)];}
function initRng(seed){return {geo:(seed^0x9E3779B9)>>>0,event:(seed^0x85EBCA6B)>>>0,other:(seed^0xC2B2AE35)>>>0};}
function systemValue(g,id){return g.systems[id]??0;}
function systemName(id){return SYSTEMS.find(x=>x[0]===id)?.[1]||id;}
function resourceName(id){return RESOURCES.find(x=>x[0]===id)?.[1]||id;}
function seasonOf(turn){return SEASONS[Math.floor(Math.max(0,turn-1)/3)%4];}
function barClass(n){return n>=65?'good':n>=35?'warn':'bad';}
function statusClass(n){return n>=4?'green':n>=2?'yellow':'red';}
function qualityLabel(n){if(n>=4)return 'Ottima';if(n===3)return 'Buona';if(n===2)return 'Modesta';if(n===1)return 'Scarsa';return 'Molto scarsa';}
function newJournal(g,title,text){g.journal.unshift({turn:g.turns,season:g.season,title,text});if(g.journal.length>100)g.journal.length=100;}
function store(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({memory:app.memory,game:app.game,lastEnding:app.lastEnding,version:VERSION}));}catch(e){console.warn('Salvataggio locale non riuscito',e);}}
function loadStore(){try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');app.memory=Array.isArray(d.memory)?d.memory:[];app.game=d.game||null;app.lastEnding=d.lastEnding||null;}catch(e){app.memory=[];app.game=null;app.lastEnding=null;}}
const app={screen:'home',game:null,memory:[],lastEnding:null,selectedRun:null,toastTimer:null,audio:{ctx:null,master:null,enabled:true,volume:.22,timer:null,started:false}};
loadStore();
const root=document.getElementById('app');

function topbar(){return `<header class="topbar"><div class="brand"><div class="brand-name">OIKISTES</div><div class="brand-sub">Alla ricerca di una nuova patria</div></div><div class="top-actions"><button class="btn icon-btn ghost" title="Musica: attiva/disattiva" data-action="music">${app.audio.enabled?'♫':'♪̸'}</button><input id="musicVolume" aria-label="Volume musica" title="Volume musica" type="range" min="0" max="0.5" step="0.01" value="${app.audio.volume}" style="width:76px;accent-color:var(--gold)"><button class="btn" data-action="memory">Memoria <span class="muted">(${app.memory.length})</span></button>${app.game?'<button class="btn" data-action="home">Menu</button>':''}</div></header>`;}
function render(){
 let body='';
 if(app.screen==='home')body=renderHome();
 else if(app.screen==='new')body=renderNew();
 else if(app.screen==='memory')body=renderMemory();
 else if(app.screen==='memoryDetail')body=renderMemoryDetail();
 else if(app.screen==='game')body=renderGame();
 else if(app.screen==='ending')body=renderEnding();
 root.innerHTML=topbar()+`<div class="screen">${body}</div>`;
}
function renderHome(){return `<section class="welcome panel"><div class="kicker">Una spedizione nel Mediterraneo arcaico</div><h1>OIKISTES</h1><p class="lead">Una nave lascia la propria città dopo aver consultato l’oracolo. A bordo vi sono famiglie, artigiani, rematori, provviste e la speranza di trovare una nuova terra.</p><p class="story" style="margin:0 auto;max-width:590px">Il mare non offre promesse. Ogni costa è una possibilità, ogni decisione lascia una traccia. La memoria delle spedizioni conserva ciò che gli uomini hanno tentato e ciò che hanno perduto.</p><div class="rule"></div><div class="actions-row"><button class="btn primary large" data-action="new">Nuova spedizione</button>${app.game?'<button class="btn gold large" data-action="resume">Riprendi la spedizione</button>':''}<button class="btn large" data-action="memory">Memoria delle spedizioni</button></div><p class="footer-note">Versione prototipo ${VERSION} · Salvataggio automatico in questo browser · Musica attivabile dall’icona ♫</p></section>`;}
function renderNew(){return `<section class="form-panel panel"><div class="kicker">Preparativi</div><h2>Una nuova spedizione</h2><p class="muted">Scegli la città di partenza e affida il comando a un ecista. Il seed identifica la sequenza casuale di questa impresa.</p><div class="form-grid"><div class="field"><label for="origin">Città di partenza</label><select id="origin">${Object.keys(ORIGINS).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label for="oikistes">Nome dell’ecista</label><input id="oikistes" maxlength="28" placeholder="Es. Timone" value="Timone"></div><div class="field full"><label for="seed">Seed (facoltativo)</label><input id="seed" inputmode="numeric" placeholder="Lascia vuoto per generarne uno casuale"></div></div><div class="form-note">Puoi conservare il seed per ripetere la stessa sequenza di eventi e destinazioni. La rotta, gli eventi e le condizioni della nave determineranno l’esito della spedizione.</div><div class="actions-row" style="justify-content:space-between"><button class="btn ghost" data-action="home">Indietro</button><button class="btn primary large" data-action="start">Salpa</button></div></section>`;}
function renderMemory(){let list=app.memory.slice().reverse();return `<section class="form-panel panel" style="max-width:980px"><div class="kicker">Archivio civico</div><h2>Memoria delle spedizioni</h2><p class="muted">Ogni impresa lascia una traccia: le colonie fondate, i viaggi interrotti e le navi mai più tornate.</p><div class="ending-grid"><div class="ending-stat"><strong>${app.memory.length}</strong><span>Spedizioni registrate</span></div><div class="ending-stat"><strong>${app.memory.filter(r=>r.status==='founded').length}</strong><span>Colonie fondate</span></div><div class="ending-stat"><strong>${app.memory.filter(r=>r.status!=='founded').length}</strong><span>Viaggi senza colonia</span></div></div><div class="memory-tools"><button class="btn" data-action="export">Esporta memoria JSON</button><button class="btn" data-action="import">Importa memoria JSON</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div>${list.length?`<div class="memory-list">${list.map(r=>`<article class="memory-card panel"><div><h3>${esc(r.colony||r.title||'Spedizione senza nome')} <span class="status ${r.status==='founded'?'green':r.status==='abandoned'?'yellow':'red'}">${esc(r.statusLabel)}</span></h3><p>${esc(r.origin)} · ${esc(r.oikistes)} · ${r.turns} tappe · Seed ${r.seed}</p><p>${esc(r.summary)}</p><p class="quiet">${new Date(r.date).toLocaleString('it-IT')}</p></div><button class="btn" data-action="memoryDetail" data-id="${esc(r.id)}">Apri registro</button></article>`).join('')}</div>`:`<div class="empty-note">L’archivio è ancora vuoto. La prima spedizione attende di salpare.</div>`}<div class="actions-row" style="justify-content:space-between"><button class="btn ghost" data-action="home">Menu principale</button><button class="btn primary" data-action="new">Intraprendi una spedizione</button></div></section>`;}
function renderMemoryDetail(){const r=app.memory.find(x=>x.id===app.selectedRun);if(!r){app.screen='memory';return renderMemory();}return `<section class="memory-detail panel"><div class="kicker">Registro della spedizione · ${esc(r.statusLabel)}</div><h2>${esc(r.colony||r.title||'Spedizione senza colonia')}</h2><div class="ending-grid"><div class="ending-stat"><strong>${r.turns}</strong><span>Tappe</span></div><div class="ending-stat"><strong>${esc(r.seed)}</strong><span>Seed</span></div><div class="ending-stat"><strong>${esc(r.score??'—')}</strong><span>Indice insediamento</span></div></div><p class="story">${esc(r.summary)}</p><div class="rule"></div><div class="identity-line"><span>Città di partenza</span><strong>${esc(r.origin)}</strong></div><div class="identity-line"><span>Ecista</span><strong>${esc(r.oikistes)}</strong></div><div class="identity-line"><span>Versione</span><strong>${esc(r.version)}</strong></div>${r.political?`<div class="identity-line"><span>Forma politica</span><strong>${esc(r.political)}</strong></div>`:''}<h3 style="margin-top:24px">Diario di bordo</h3><div class="journal-full">${(r.journal||[]).slice().reverse().map(e=>`<div class="diary-entry"><div class="diary-meta">Tappa ${e.turn} · ${esc(e.season||'')}</div><div class="diary-title">${esc(e.title)}</div><div class="diary-text">${esc(e.text)}</div></div>`).join('')}</div><div class="actions-row" style="justify-content:space-between"><button class="btn ghost" data-action="memory">Torna all’archivio</button><button class="btn" data-action="replay" data-seed="${esc(r.seed)}" data-origin="${esc(r.origin)}" data-oikistes="${esc(r.oikistes)}">Ripeti il seed</button></div></section>`;}
function resourceMarkup(g,id,label){let n=g.resources[id]??0;return `<div class="resource"><div class="resource-head"><span>${label}</span><strong>${Math.round(n)}</strong></div><div class="bar"><i class="${barClass(n)}" style="width:${clamp(n)}%"></i></div></div>`;}

function makeGame(origin,oikistes,seed){const o=ORIGINS[origin];const g={id:'run-'+Date.now()+'-'+Math.floor(Math.random()*99999),version:VERSION,seed:seed>>>0,origin,oikistes:oikistes||'Ecista',turns:0,season:'Primavera',resources:{colonists:100,food:100,water:100,kit:100,goods:o.goods,cohesion:70},systems:{nav:100,landing:100,terrain:100,water:100,harbor:100,resources:100,environment:100,technical:80,culture:o.culture},teams:3,fama:50,politics:{ecista:50,aristocracy:30,military:25,merchant:25,concentration:35,participation:50},region:null,site:null,pendingEvent:null,phase:'event',journal:[],usedEvents:[],lastEvents:[],visitedNames:[],destroyed:0,choices:[],discoveries:[],started:new Date().toISOString(),firstRegions:o.regions.slice(),ending:null};g.rng=initRng(g.seed);return g;}

function consumeTravel(g){const p=g.resources.colonists;const foodCost=11+Math.ceil(p/35);const waterCost=12+Math.ceil(p/35);let notes=[];if(g.resources.food>=foodCost)g.resources.food-=foodCost;else{g.resources.food=0;g.resources.colonists=clamp(g.resources.colonists-8,0,100);g.resources.cohesion=clamp(g.resources.cohesion-9);notes.push('I viveri sono esauriti: fame e debolezza causano la perdita di 8 coloni e un forte calo della coesione.');}if(g.resources.water>=waterCost)g.resources.water-=waterCost;else{g.resources.water=0;g.resources.colonists=clamp(g.resources.colonists-12,0,100);g.resources.cohesion=clamp(g.resources.cohesion-12);notes.push('L’acqua è esaurita: la disidratazione provoca la perdita di 12 coloni e un grave calo della coesione.');}if(g.resources.kit<=0){g.systems.technical=clamp(g.systems.technical-4);notes.push('Il corredo è esaurito: senza attrezzi e materiali, le capacità tecniche della spedizione peggiorano.');}if(g.resources.cohesion<=0){g.resources.colonists=clamp(g.resources.colonists-4,0,100);notes.push('La comunità è ormai disgregata: altri coloni abbandonano o si perdono durante la traversata.');}const wear={nav:3+(g.turns>3?1:0),landing:1,technical:1};for(const [id,d] of Object.entries(wear))g.systems[id]=clamp(g.systems[id]-d);notes.push('La navigazione prolungata logora lo scafo, le attrezzature e gli strumenti di bordo.');return {notes,foodCost,waterCost,wear};}
function chooseEvent(g){let unused=EVENTS.filter(e=>!g.usedEvents.includes(e.id)&&!g.lastEvents.includes(e.id));if(!unused.length)unused=EVENTS.filter(e=>!g.lastEvents.includes(e.id));if(!unused.length)unused=EVENTS.slice();let weights={natural:.42,onboard:.28,human:.30};if(g.season==='Autunno')weights.natural+=.05;if(g.season==='Inverno'){weights.natural+=.13;weights.human-=.06;}if(g.season==='Estate'){weights.human+=.04;weights.onboard-=.04;}const roll=rand(g,'event');let category=roll<weights.natural?'natural':roll<weights.natural+weights.onboard?'onboard':'human';let pool=unused.filter(e=>e.cat===category);if(!pool.length)pool=unused;const ev=pick(g,'event',pool);g.usedEvents.push(ev.id);g.lastEvents.push(ev.id);if(g.lastEvents.length>5)g.lastEvents.shift();return ev;}
function depart(){const g=app.game;if(!g)return;g.turns+=1;g.season=seasonOf(g.turns);let travel=consumeTravel(g);if(g.resources.colonists<=0){finishFailure('La comunità si è estinta durante la navigazione.','La spedizione non è riuscita a raggiungere una costa adatta. La mancanza di risorse ha consumato le forze dei coloni.');return;}g.pendingEvent=chooseEvent(g);g.site=null;g.phase='event';newJournal(g,'In navigazione',`La nave affronta una nuova tratta. Viveri −${travel.foodCost}; acqua −${travel.waterCost}.${travel.notes.length?' '+travel.notes.join(' '):''}`);store();render();}
function applyEffects(g,effect){if(!effect)return;for(const [k,v] of Object.entries(effect)){if(k==='sys'){for(const [id,d]of Object.entries(v)){const impact=d<0?Math.ceil(Math.abs(d)*1.65)*-1:d;g.systems[id]=clamp(g.systems[id]+impact);}}else if(k==='pol'){for(const [id,d]of Object.entries(v))g.politics[id]=clamp((g.politics[id]||0)+d);}else if(k==='log'){}else if(k==='pop'){const impact=v<0?Math.ceil(Math.abs(v)*1.8)*-1:v;g.resources.colonists=clamp(g.resources.colonists+impact);}else if(k==='fama')g.fama=clamp(g.fama+v);else if(g.resources[k]!==undefined){const impact=v<0?Math.ceil(Math.abs(v)*1.8)*-1:v;g.resources[k]=clamp(g.resources[k]+impact);}}}
function optionResult(g,opt){if(opt.chance){let eff=systemValue(g,opt.chance.system);let probability=clamp(opt.chance.base+eff*opt.chance.scale,8,92);let success=rand(g,'other')*100<probability;const result=success?opt.good:opt.bad;applyEffects(g,result);return {success,text:(result&&result.log)||(success?'La scelta riesce.':'La scelta non produce l’esito sperato.')};}applyEffects(g,opt.effect);return {success:true,text:(opt.effect&&opt.effect.log)||opt.log||'La decisione viene eseguita.'};}
function eventChoice(index){const g=app.game,e=g?.pendingEvent;if(!e)return;const opt=e.options[index];if(!opt)return;const result=optionResult(g,opt);let wearText='';if(e.id==='raiders'&&index===0){g.politics.military=clamp(g.politics.military+14);g.politics.concentration=clamp(g.politics.concentration+4);wearText=' La difesa accresce il prestigio dei comandanti e dei gruppi armati.';}if(e.cat==='natural'&&['storm','headwinds','calm','fog','rocks'].includes(e.id)){const d=e.id==='storm'||e.id==='rocks'?7:e.id==='headwinds'?5:4;g.systems.nav=clamp(g.systems.nav-d);wearText=` La navigazione subisce un ulteriore logorio: tenuta della nave −${d}.`;}else if(e.cat==='onboard'&&['rudder','fire','mold','fever','rower','amphorae'].includes(e.id)){const target=({rudder:'nav',fire:'landing',mold:'technical',fever:'landing',rower:'nav',amphorae:'water'})[e.id];const d=({rudder:5,fire:4,mold:3,fever:3,rower:4,amphorae:3})[e.id];g.systems[target]=clamp(g.systems[target]-d);wearText=` L’incidente compromette anche ${systemName(target).toLowerCase()} (−${d}).`;}else if(e.cat==='human'&&(/raiders|springguard/.test(e.id))){g.systems.landing=clamp(g.systems.landing-3);wearText=' Il confronto mette alla prova la capacità di sbarco e difesa (−3).';}g.choices.push({turn:g.turns,event:e.title,choice:opt.label,result:result.text+wearText});newJournal(g,e.title,result.text+wearText);g.pendingEvent=null;g.destroyed=countDestroyed(g);if(g.resources.colonists<=0){finishFailure('La comunità si è disgregata durante la navigazione.',`Dopo l’ultimo avvenimento, la spedizione di ${g.oikistes} non dispone più di coloni in grado di proseguire.`);return;}generateSite(g);g.phase='site';store();render();}
function profileStat(g,range){return irand(g,'geo',range[0],range[1]);}
function genDestination(g){let region;if(!g.region){region=pick(g,'geo',g.firstRegions);}else{let options=(REGIONS[g.region]||Object.keys(REGIONS)).filter(x=>x!==g.region);region=pick(g,'geo',options);}const profileWeights={river:.65,volcanic:1.25,bay:.85,rocky:1.35,swamp:1.35,mountain:1.30};const totalWeight=PROFILES.reduce((n,p)=>n+profileWeights[p.id],0);let profileRoll=rand(g,'geo')*totalWeight;let profile=PROFILES[PROFILES.length-1];for(const candidate of PROFILES){profileRoll-=profileWeights[candidate.id];if(profileRoll<=0){profile=candidate;break;}}let stats={};for(const [key,range]of Object.entries(profile.ranges))stats[key]=profileStat(g,range);
 let population=pick(g,'geo',POPULATIONS);let hiddenCount=irand(g,'geo',1,3);let hidden=[];let pool=HIDDEN_FEATURES.slice();for(let i=0;i<hiddenCount;i++){let f=pick(g,'geo',pool);pool=pool.filter(x=>x.id!==f.id);hidden.push({...f,delta:{...f.delta}});for(const [k,v]of Object.entries(f.delta))stats[k]=clamp((stats[k]??0)+v,0,5);}
 let name=pick(g,'geo',NAME_A);let tries=0;while(g.visitedNames.includes(name)&&tries++<10)name=pick(g,'geo',NAME_A)+' '+(tries+1);
 let assessment={};const assessor={fertility:'terrain',water:'water',harbor:'harbor',resources:'resources',safety:'environment'};for(const key of ['fertility','water','harbor','resources','safety']){let accuracy=systemValue(g,assessor[key]);let error=accuracy>=85?(rand(g,'geo')<.18?irand(g,'geo',-1,1):0):irand(g,'geo',-Math.max(1,Math.ceil((100-accuracy)/35)),Math.max(1,Math.ceil((100-accuracy)/35)));assessment[key]=clamp(stats[key]+error,0,5);}
 return {region,profile,name,stats,assessment,population,hidden,revealed:[],description:population.id==='none'?'Non si distinguono abitazioni stabili. La costa sembra poco frequentata.':population.id==='emporium'?'Si intravedono imbarcazioni e strutture presso la riva. Il luogo potrebbe essere frequentato da mercanti e viaggiatori.':population.id==='contested'?'Sulla costa e nell’entroterra compaiono tracce di gruppi diversi. I rapporti fra loro non sono chiari.':'Si notano tracce di presenza umana nell’entroterra, ma non è possibile stabilire quanto sia esteso il territorio controllato dagli abitanti.',contactDone:false};}
function generateSite(g){g.site=genDestination(g);g.region=g.site.region;g.visitedNames.push(g.site.name);newJournal(g,'Una nuova costa',`La spedizione raggiunge ${g.site.name}, nella regione ${g.site.region}. ${g.site.population.label}.`);}
function explore(){const g=app.game,s=g?.site;if(!s||g.teams<=0||!s.hidden.length)return;g.teams--;const f=s.hidden.shift();s.revealed.push(f);g.discoveries.push({turn:g.turns,site:s.name,name:f.name,desc:f.desc});newJournal(g,'Ricognizione',`Una squadra esplora il territorio e scopre: ${f.name.toLowerCase()}. ${f.desc}`);store();render();}
function countDestroyed(g){return Object.values(g.systems).filter(v=>v<=0).length;}
function continueJourney(){const g=app.game;if(!g||!g.site)return;if(countDestroyed(g)>=6)return;const abandoned=g.site.name;const lostFood=Math.min(g.resources.food,4),lostWater=Math.min(g.resources.water,5);g.resources.food=Math.max(0,g.resources.food-4);g.resources.water=Math.max(0,g.resources.water-5);g.resources.cohesion=clamp(g.resources.cohesion-2);g.systems.nav=clamp(g.systems.nav-2);newJournal(g,'La partenza dalla costa',`L’ecista decide di non fondare una colonia a ${abandoned}. Preparare di nuovo la nave e lasciare la costa comporta uno spreco di viveri (−${lostFood}), acqua (−${lostWater}) e coesione (−2). La nave riprende il mare; ciò che si trova oltre l’orizzonte è ignoto.`);g.choices.push({turn:g.turns,choice:'Proseguire',site:abandoned});g.site=null;g.destroyed=countDestroyed(g);depart();}
function beginFounding(){const g=app.game;if(!g||!g.site)return;g.phase='founding';newJournal(g,'La decisione di fondare',`L’ecista ${g.oikistes} decide di fermarsi a ${g.site.name}. La spedizione si prepara a fondare un nuovo insediamento.`);store();render();}
function territoryScore(s){const w={fertility:.25,water:.25,harbor:.15,resources:.15,safety:.20};let base=Object.entries(w).reduce((a,[k,v])=>a+(s.stats[k]/5*100)*v,0);const people=s.population;if(people.id==='none')return base;const reception=(people.openness-50)*.10+(0/* reputation is applied by the caller */);const tension=Math.max(0,people.power-50)*.10;return clamp(base+reception-tension,0,100);}
function expeditionScore(g){const r=g.resources,parts={people:clamp(r.colonists),provisions:(clamp(r.food)+clamp(r.water))/2,kit:clamp(r.kit),technical:clamp(g.systems.technical),landing:clamp(g.systems.landing),culture:clamp(g.systems.culture)};return parts.people*.25+parts.provisions*.20+parts.kit*.20+parts.technical*.15+parts.landing*.10+parts.culture*.10;}
function politicalForm(p){const coercive=p.ecista>=62&&p.ecista>=p.aristocracy+8&&p.ecista>=p.participation+5;if(coercive&&p.military>=35)return 'Tirannide sostenuta dai militari';if(coercive)return 'Potere personale dell’ecista';if(p.military>=38&&p.military>=p.aristocracy+5&&p.military>=p.merchant+5)return 'Controllo militare';if(p.aristocracy>=52&&p.aristocracy>=p.military&&p.aristocracy>=p.merchant)return 'Aristocrazia';if(p.merchant>=50&&p.concentration>=48&&p.merchant>=p.participation)return 'Oligarchia mercantile';if(p.participation>=62&&p.concentration<=48)return 'Comunità partecipativa';if(p.participation>=53&&p.concentration<=58)return 'Comunità di piccoli proprietari';return 'Assetto misto di famiglie e gruppi influenti';}
function qualityOf(score){return score<30?'Fondazione fallita':score<45?'Insediamento precario':score<60?'Comunità fragile':score<80?'Colonia stabile':'Colonia prospera';}
function foundedNarrative(g,score,form,quality){const s=g.site;const clauses=[];if(score>=80)clauses.push('Le condizioni del territorio e le risorse della spedizione consentono alla comunità di avviare rapidamente le proprie attività.');else if(score>=60)clauses.push('La comunità dispone di condizioni sufficienti per consolidare l’insediamento, anche se alcune difficoltà restano aperte.');else if(score>=45)clauses.push('La colonia sopravvive, ma le prime stagioni saranno segnate da difficoltà e incertezze.');else if(score>=30)clauses.push('La fondazione è precaria: la comunità fatica a garantire le condizioni essenziali della vita quotidiana.');else clauses.push('Le condizioni del territorio e della spedizione si rivelano insufficienti. La comunità non riesce a consolidare la fondazione.');
 if(s.stats.water<=1)clauses.push('La scarsità d’acqua rappresenta il problema più urgente.');else if(s.stats.fertility>=4)clauses.push('Le terre circostanti offrono buone possibilità per l’agricoltura.');if(s.stats.harbor>=4)clauses.push('L’approdo riparato potrà favorire i contatti marittimi.');if(s.stats.safety<=1)clauses.push('L’ambiente circostante espone l’insediamento a rischi difficili da controllare.');if(s.population.id!=='none'&&g.fama>=62)clauses.push('I rapporti costruiti durante il viaggio favoriscono un primo contatto con le comunità già presenti nel territorio.');else if(s.population.id!=='none'&&g.fama<=30)clauses.push('La fama della spedizione precede i coloni: gli abitanti del territorio guardano con diffidenza al nuovo insediamento.');
 if(form==='Tirannide sostenuta dai militari')clauses.push('L’ecista concentra il potere nelle proprie mani e si appoggia ai capi armati per imporre le decisioni: la nuova comunità assume i tratti di una tirannide.');else if(form==='Controllo militare')clauses.push('I comandanti e i gruppi armati assumono il controllo delle decisioni: la difesa della colonia si trasforma in un potere militare.');else if(form==='Comunità partecipativa')clauses.push('Durante la traversata si sono rafforzate le consuetudini assembleari e la cooperazione fra le famiglie.');else if(form==='Comunità di piccoli proprietari')clauses.push('La comunità conserva un equilibrio relativamente ampio fra famiglie e gruppi di coloni.');else if(form==='Aristocrazia')clauses.push('Le famiglie più influenti hanno acquisito un peso preponderante durante la spedizione.');else if(form==='Oligarchia militare')clauses.push('Le necessità della navigazione e della difesa hanno rafforzato il ruolo dei capi militari.');else if(form==='Oligarchia mercantile')clauses.push('Gli scambi e il controllo delle merci hanno accresciuto il potere dei gruppi mercantili.');else if(form==='Potere personale dell’ecista')clauses.push('Le difficoltà del viaggio hanno rafforzato l’autorità personale dell’ecista.');else clauses.push('Il potere resta diviso fra famiglie e gruppi influenti, senza un equilibrio definitivo.');
 return `Nel luogo chiamato ${s.name}, i coloni di ${g.origin} fondarono un insediamento sotto la guida di ${g.oikistes}. ${clauses.join(' ')}`;}
function finishFounding(){const g=app.game;if(!g||!g.site)return;const territory=territoryScore(g.site),expedition=expeditionScore(g),cohesion=clamp(g.resources.cohesion);const receptionBonus=g.site.population.id==='none'?0:clamp((g.fama-50)*.10,-5,5);let score=clamp(territory+receptionBonus,0,100)*.52+expedition*.33+cohesion*.15;const earlyPenalty=g.turns===1?22:g.turns===2?12:g.turns===3?5:0;score-=earlyPenalty;let cap=100;if(g.site.stats.water===0)cap=Math.min(cap,29);else if(g.site.stats.water===1&&g.resources.water<20)cap=Math.min(cap,44);if(g.site.stats.safety===0)cap=Math.min(cap,59);if(g.resources.colonists<30)cap=Math.min(cap,29);score=Math.round(Math.min(score,cap));const form=politicalForm(g.politics),quality=qualityOf(score);const enoughPeople=g.resources.colonists>=30;const founded=score>=30&&enoughPeople;const summary=!enoughPeople?`La spedizione raggiunge ${g.site.name}, ma restano soltanto ${Math.round(g.resources.colonists)} coloni: meno dei 30 necessari per fondare una comunità autosufficiente. I superstiti non possono garantire la difesa, il lavoro dei campi e la continuità dell’insediamento. La colonia non sopravvive.`:founded?foundedNarrative(g,score,form,quality):`La spedizione guidata da ${g.oikistes} tentò di fondare un insediamento a ${g.site.name}, ma le condizioni si rivelarono troppo difficili. ${foundedNarrative(g,score,form,quality)}`;newJournal(g,'La fondazione di '+g.site.name,summary);finishRecord({status:founded?'founded':'failed_foundation',statusLabel:quality,colony:g.site.name,score,quality,political:form,summary,survivors:Math.round(g.resources.colonists),territory:Math.round(territory),expedition:Math.round(expedition)});}
function finishFailure(title,summary,status='failed',statusLabel='Spedizione perduta'){const g=app.game;if(!g)return;newJournal(g,title,summary);finishRecord({status,statusLabel,title,summary});}
function finishRecord(extra){const g=app.game;if(!g)return;const record={id:g.id,date:new Date().toISOString(),version:VERSION,seed:g.seed,origin:g.origin,oikistes:g.oikistes,turns:g.turns,status:'failed',statusLabel:'Spedizione conclusa',title:'La spedizione',colony:null,score:null,political:null,survivors:Math.round(g.resources.colonists),summary:'',journal:g.journal.slice(),choices:g.choices.slice(),discoveries:g.discoveries.slice(),...extra};app.memory.push(record);app.lastEnding=record;app.game=null;app.screen='ending';store();render();}
function startToast(text){let el=document.querySelector('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=text;document.body.appendChild(el);clearTimeout(app.toastTimer);app.toastTimer=setTimeout(()=>el.remove(),2400);}

// Musica originale: ostinato modale in 4/4, basso pulsante e accenti percussivi.
const MUSIC={notes:[293.66,293.66,349.23,392.00,440.00,392.00,349.23,329.63,293.66,392.00,440.00,523.25,493.88,440.00,392.00,349.23],bass:[146.83,146.83,110.00,110.00,130.81,130.81,98.00,98.00]};
function musicNote(ctx,freq,time,duration,volume,type='triangle'){const osc=ctx.createOscillator();const gain=ctx.createGain();const filter=ctx.createBiquadFilter();osc.type=type;osc.frequency.setValueAtTime(freq,time);osc.detune.setValueAtTime(-3,time);filter.type='lowpass';filter.frequency.setValueAtTime(type==='sine'?900:1900,time);gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),time+.012);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);osc.connect(filter);filter.connect(gain);gain.connect(app.audio.master||ctx.destination);osc.start(time);osc.stop(time+duration+.025);}
function musicDrum(ctx,time,pitch,volume,duration=.13){const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(pitch,time);osc.frequency.exponentialRampToValueAtTime(Math.max(38,pitch*.42),time+duration);gain.gain.setValueAtTime(volume,time);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);osc.connect(gain);gain.connect(app.audio.master||ctx.destination);osc.start(time);osc.stop(time+duration+.01);}
function scheduleMusicLoop(){const a=app.audio;if(!a.ctx||!a.enabled)return;const ctx=a.ctx;const start=ctx.currentTime+.06;const beat=.39;MUSIC.notes.forEach((n,i)=>{const t=start+i*beat;musicNote(ctx,n,t,.29,.052,'triangle');if(i%2===0)musicNote(ctx,n/2,t,.42,.025,'sawtooth');if(i%4===0)musicDrum(ctx,t,92,.075,.19);else if(i%2===1)musicDrum(ctx,t,185,.018,.055);if(i%4===2)musicNote(ctx,n*1.5,t,.16,.012,'triangle');});MUSIC.bass.forEach((n,i)=>{const t=start+i*beat*2;musicNote(ctx,n,t,.72,.052,'sine');musicNote(ctx,n/2,t,.8,.018,'triangle');});a.timer=setTimeout(scheduleMusicLoop,MUSIC.notes.length*beat*1000);}
async function toggleMusic(){const a=app.audio;a.enabled=!a.enabled;if(a.enabled){try{if(!a.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C){startToast('Audio non supportato da questo browser.');a.enabled=false;render();return;}a.ctx=new C();a.master=a.ctx.createGain();a.master.gain.value=a.volume;a.master.connect(a.ctx.destination);}await a.ctx.resume();if(a.timer)clearTimeout(a.timer);scheduleMusicLoop();}catch(e){a.enabled=false;startToast('Non è stato possibile avviare l’audio.');}}else{if(a.timer)clearTimeout(a.timer);if(a.ctx)await a.ctx.suspend();}render();}

root.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
 if(action==='new'){app.screen='new';render();}
 else if(action==='home'){app.screen='home';render();}
 else if(action==='resume'){app.screen='game';render();}
 else if(action==='memory'){app.screen='memory';render();}
 else if(action==='memoryDetail'){app.selectedRun=b.dataset.id;app.screen='memoryDetail';render();}
 else if(action==='start'){const origin=document.getElementById('origin')?.value||'Calcide';const oikistes=(document.getElementById('oikistes')?.value||'Timone').trim().slice(0,28)||'Timone';const raw=(document.getElementById('seed')?.value||'').trim();let seed;if(raw){const n=Number(raw);if(!Number.isFinite(n)||!Number.isInteger(n)){startToast('Il seed deve essere un numero intero.');return;}seed=n>>>0;}else seed=Math.floor(Math.random()*4294967296)>>>0;beginGame(origin,oikistes,seed);await ensureMusic();}
 else if(action==='eventChoice')eventChoice(Number(b.dataset.index));
 else if(action==='explore')explore();
 else if(action==='continue')continueJourney();
 else if(action==='found')beginFounding();
 else if(action==='finishFounding')finishFounding();
 else if(action==='fullJournal'){app.game.previousPhase=app.game.phase;app.game.phase='journal';render();}
 else if(action==='backToGame'){app.game.phase=app.game.previousPhase||(app.game.site?'site':'event');delete app.game.previousPhase;render();}
 else if(action==='music')toggleMusic();
 else if(action==='export')exportMemory();
 else if(action==='import')document.getElementById('importFile')?.click();
 else if(action==='replay'){const seed=Number(b.dataset.seed)>>>0;beginGame(b.dataset.origin,b.dataset.oikistes,seed);app.screen='game';render();}
});
async function ensureMusic(){const a=app.audio;if(!a.enabled||a.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;a.ctx=new C();a.master=a.ctx.createGain();a.master.gain.value=a.volume;a.master.connect(a.ctx.destination);await a.ctx.resume();scheduleMusicLoop();}catch(e){/* Audio facoltativo: il gioco resta pienamente utilizzabile. */}}
root.addEventListener('input',ev=>{if(ev.target.id==='musicVolume'){app.audio.volume=Number(ev.target.value);if(app.audio.master&&app.audio.ctx)app.audio.master.gain.setTargetAtTime(app.audio.volume,app.audio.ctx.currentTime,.04);}});
root.addEventListener('change',ev=>{if(ev.target.id==='importFile'&&ev.target.files?.[0])importMemory(ev.target.files[0]);});
function exportMemory(){const payload={format:'APOIKIA-memory',version:VERSION,exported:new Date().toISOString(),memory:app.memory};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='apoikia-memoria.json';a.click();URL.revokeObjectURL(url);startToast('Memoria esportata.');}
function importMemory(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);const incoming=Array.isArray(d)?d:d.memory;if(!Array.isArray(incoming))throw new Error('Formato non valido');const ids=new Set(app.memory.map(x=>x.id));let count=0;for(const r of incoming){if(r&&r.id&&!ids.has(r.id)&&r.seed!==undefined&&r.journal){app.memory.push(r);ids.add(r.id);count++;}}store();render();startToast(`${count} spedizioni importate.`);}catch(e){startToast('Il file non contiene una memoria APOIKIA valida.');}};reader.readAsText(file);}

// Recupero di una partita salvata e inizializzazione.
if(app.game){app.screen='home';}
render();
